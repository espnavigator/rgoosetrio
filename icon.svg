<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Compadres">
  <!--
    A single palm, from the Compadres mark on the shirt and the sleeve. The full
    mark has two of them either side of the guitar, but at 16 pixels — which is
    the size a browser tab actually draws this — two palms collapse into a
    smudge. One, drawn large and heavy, still reads.
  -->
  <rect width="64" height="64" rx="10" fill="#f3e8d5" />

  <g fill="#1b1410">
    <!-- Trunk: thick, with a slight lean, tapering towards the crown. -->
    <path d="M27.6 52.5c-.5-11.6 1.2-21 5.2-28.4l4.3 2.1c-3.6 6.7-5.2 15.3-4.7 26.3z" />

    <!-- Crown of fronds, radiating from the top of the trunk. -->
    <path d="M34 23.6c-4.2-4.6-9.7-6.6-16.4-5.9 3.7-4 9.6-4.6 15-2z" />
    <path d="M34 23.6c-4.9-2.7-10-2.7-15.3.1 1.9-4.6 6.4-7 12.1-6.5z" />
    <path d="M34 23.6c-3.1-5.1-3.3-10.6-.6-16.4 3.2 4.2 4.6 9.6 4.1 16z" />
    <path d="M34 23.6c1.7-5.6 5.7-9.4 11.9-11.4-2.7 4.3-4.2 8.7-4.6 13.2z" />
    <path d="M34 23.6c4-3.6 8.7-4.9 14-3.9-3.9 1.7-7.1 3.9-9.7 6.6z" />
  </g>

  <!-- The ground it stands on. -->
  <rect x="12" y="51.5" width="40" height="4.5" rx="2.25" fill="#d02e1a" />
</svg>
