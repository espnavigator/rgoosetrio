<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Compadres">
  <!--
    The Compadres mark: two palms, one either side, as on the shirt and the
    sleeve artwork. Drawn heavy and simple because a favicon is read at 16px,
    where thin fronds turn to mush. The right palm is the left one mirrored
    about the centre line, so the pair is symmetrical and the gap between them
    is where the guitar sits on the shirt.
  -->
  <rect width="64" height="64" rx="10" fill="#f3e8d5" />

  <!-- One palm, drawn on the left. -->
  <g id="palm" fill="#1b1410">
    <!-- Trunk, leaning slightly out from centre. -->
    <path d="M15.4 51.5c-.3-8.4.9-15.4 3.8-21.2l2.9 1.4c-2.6 5.2-3.7 11.7-3.4 19.8z" />
    <!-- Fronds, radiating from the crown. -->
    <path d="M20 27.4c-2.6-3.1-6.2-4.6-10.6-4.3 2.4-2.6 6.4-3 10-1.2z" />
    <path d="M20 27.4c-3.4-1.6-6.9-1.4-10.5.6 1-3.2 4-5.1 8-5z" />
    <path d="M20 27.4c-1.9-3.6-1.9-7.5.1-11.4 2 2.9 2.8 6.5 2.4 10.6z" />
    <path d="M20 27.4c1.2-3.8 3.9-6.4 8-7.7-1.6 3-2.6 6-3 9z" />
    <path d="M20 27.4c2.7-2.4 5.9-3.2 9.5-2.5-2.6 1.2-4.8 2.7-6.6 4.5z" />
  </g>

  <!-- The same palm, mirrored to the right-hand side. -->
  <use href="#palm" transform="translate(64,0) scale(-1,1)" />

  <!-- The ground the two of them stand on. -->
  <rect x="9" y="50.5" width="46" height="4" rx="2" fill="#d02e1a" />
</svg>
